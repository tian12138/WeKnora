name: Test WeKnora Lite Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest

    env:
      CGO_ENABLED: "1"
      EDITION: "lite"
      GOLANG_PROTOBUF_REGISTRATION_CONFLICT: "warn"

    steps:

      - name: Disable Git CRLF conversion
        shell: pwsh
        run: |
          git config --global core.autocrlf false

      - name: Checkout WeKnora v0.8.2
        uses: actions/checkout@v6
        with:
          repository: Tencent/WeKnora
          ref: v0.8.2
          fetch-depth: 0

      - name: Fix license manifest CRLF
        shell: bash
        run: |
          sed -i 's/\r$//' licenses/sources/modules.tsv

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare SQLite headers
        shell: bash
        run: |
          go mod download

          SQLITE_DIR="$(go list -m -f '{{.Dir}}' github.com/mattn/go-sqlite3)"

          echo "SQLite module: $SQLITE_DIR"

          mkdir -p "$GITHUB_WORKSPACE/.deps/sqlite"

          cp "$SQLITE_DIR/sqlite3-binding.h" \
             "$GITHUB_WORKSPACE/.deps/sqlite/sqlite3.h"

          cp "$SQLITE_DIR/sqlite3ext.h" \
             "$GITHUB_WORKSPACE/.deps/sqlite/sqlite3ext.h"

          ls -lh "$GITHUB_WORKSPACE/.deps/sqlite"

      - name: Test native Windows Go build
        shell: bash
        run: |
          export CGO_ENABLED=1
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-I${GITHUB_WORKSPACE}/.deps/sqlite -Wno-deprecated-declarations"

          echo "Go:"
          go version

          echo "GCC:"
          gcc --version

          echo "Start direct Go build"

          cd cmd/desktop

          go build \
            -p 1 \
            -buildvcs=false \
            -tags "desktop,sqlite_fts5,production" \
            -o _prebuild_tmp.exe .

          echo
          echo "=================================="
          echo "DIRECT GO BUILD SUCCESS"
          echo "=================================="

          ls -lh _prebuild_tmp.exe
