name: Build WeKnora Lite Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      CGO_ENABLED: "1"
      EDITION: "lite"
      GOLANG_PROTOBUF_REGISTRATION_CONFLICT: "warn"
      CGO_CFLAGS: "-Wno-deprecated-declarations"

    steps:
      - name: Checkout WeKnora v0.8.2
        uses: actions/checkout@v6
        with:
          repository: Tencent/WeKnora
          ref: v0.8.2
          fetch-depth: 0

      - name: Verify source
        shell: pwsh
        run: |
          git status
          git describe --tags --always
          git rev-parse --short HEAD

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Check environment
        shell: pwsh
        run: |
          go version
          node --version
          npm --version
          gcc --version
          & "$env:USERPROFILE\go\bin\wails.exe" version

      - name: Build WeKnora Lite Windows installer
        shell: bash
        run: |
          export EDITION=lite
          export CGO_ENABLED=1
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          export CGO_CFLAGS="-Wno-deprecated-declarations"

          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"

          bash ./scripts/check-license-bundle.sh

          cd cmd/desktop

          wails build \
            -clean \
            -tags "sqlite_fts5" \
            -platform "windows/amd64" \
            -nsis \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite"

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact

          Get-ChildItem "cmd\desktop\build\bin" -Recurse

          Copy-Item `
            "cmd\desktop\build\bin\WeKnora Lite-amd64-installer.exe" `
            "artifact\WeKnora-Lite-v0.8.2-windows-amd64-setup.exe"

          Get-FileHash `
            "artifact\WeKnora-Lite-v0.8.2-windows-amd64-setup.exe" `
            -Algorithm SHA256 |
            Format-List |
            Out-File "artifact\SHA256.txt"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: WeKnora-Lite-v0.8.2-Windows-amd64
          path: artifact/
          retention-days: 7
